
name: Build Outpost Zero Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack game source
        run: |
          mkdir source
          unzip -q outpost-zero-source.zip -d source
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install and build web game
        working-directory: source
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Outpost-Zero-debug-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
